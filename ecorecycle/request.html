<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Request pickup | EcoRecycle</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <nav class="navbar eco-nav">
        <div class="container flex-wrap">
          <a class="navbar-brand" href="index.html">Eco<span>Recycle</span></a>
          <ul class="nav flex-wrap">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="points.html">Drop-off points</a></li>
            <li class="nav-item"><a class="nav-link" href="tips.html">Eco tips</a></li>
            <li class="nav-item"><a class="nav-link active" href="request.html">Request pickup</a></li>
          </ul>
        </div>
      </nav>
    </header>
    
    <main>
      <div class="container">
        <div class="page-head">
          <h1>Request a pickup</h1>
          <p class="lead">Old furniture, a fridge or large loads? Fill out the form below and our courier will contact you.</p>
        </div>
        <div class="row g-4 justify-content-center">
          <div class="col-lg-8">
            <div class="box eco-form-box shadow-sm">
              <form id="pickupForm" action="#" method="post" novalidate>
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label d-block fw-bold">Service Type</label>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="serviceType" id="standardPickup" value="standard" checked>
                      <label class="form-check-label" for="standardPickup">Standard Pickup</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="serviceType" id="expressPickup" value="express">
                      <label class="form-check-label" for="expressPickup">Express Pickup</label>
                    </div>
                  </div>

                
                  <div class="col-md-6">
                    <label class="form-label" for="nm">Full name</label>
                    <input class="form-control" id="nm" name="name" placeholder="Your full name">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="ph">Phone</label>
                    <input class="form-control" id="ph" name="phone" type="tel" placeholder="+7 701 234 56 78">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="em">Email</label>
                    <input class="form-control" id="em" name="email" type="email" placeholder="name@example.com">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="wt">Waste type</label>
                    <select class="form-select" id="wt" name="type">
                      <option value="">Choose...</option>
                      <option value="furniture">Old furniture</option>
                      <option value="appliances">Appliances</option>
                      <option value="electronics">Electronics</option>
                      <option value="paper_plastic">Large paper or plastic load</option>
                    </select>
                  </div>

                  <div class="col-12">
                    <label class="form-label d-block fw-bold">Load Size</label>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="size" id="s1" value="small" checked>
                      <label class="form-check-label" for="s1">Small</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="size" id="s2" value="medium">
                      <label class="form-check-label" for="s2">Medium</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="size" id="s3" value="large">
                      <label class="form-check-label" for="s3">Large</label>
                    </div>
                  </div>

                  <div class="col-md-8">
                    <label class="form-label" for="ad">Pickup address</label>
                    <input class="form-control" id="ad" name="address" placeholder="Street, house, apartment">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="dt">Preferred date</label>
                    <input class="form-control" id="dt" name="date" type="date">
                  </div>


                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="smsNotif">
                      <label class="form-check-label" for="smsNotif">Also send confirmation by SMS</label>
                    </div>
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" id="ok">
                      <label class="form-check-label" for="ok">I agree to the pickup rules and terms *</label>
                    </div>
                  </div>

                  <div class="col-12 d-flex flex-column flex-md-row gap-2 mt-4">
                    <button class="btn btn-eco flex-grow-1 order-1 order-md-2" type="submit">Send request</button>
                    <button class="btn btn-outline-secondary flex-grow-1 order-2 order-md-1" type="reset">Clear</button>
                  </div>

                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="row g-3">
          <div class="col-md-6"><b class="text-white">EcoRecycle</b><br>Sort smart. Drop off close. Waste less.</div>
          <div class="col-md-6">Credits: <a href="https://fonts.google.com">Google Fonts</a>, <a href="https://getbootstrap.com">Bootstrap</a>.</div>
        </div>
      </div>
    </footer>

    <script src="validation.js" defer></script>
  </body>
</html>
